[package.metadata.docs.rs]
features     = ["sqlite-session", "serde", "fsm", "parsers", "html", "html5ever", "parser", "codegen"]
rustdoc-args = ["--cfg", "docsrs"]

[package.metadata.cargo-machete]
ignored = ["anyhow"] # dev-dependency used across examples/
