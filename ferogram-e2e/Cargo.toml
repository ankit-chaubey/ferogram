[package]
name        = "ferogram-e2e"
description = "Telegram secret chat (end-to-end encrypted) support for ferogram"
version     = "0.1.0"
readme      = "README.md"
edition.workspace    = true
license.workspace    = true
authors.workspace    = true
repository.workspace = true
homepage.workspace   = true
documentation = "https://docs.rs/ferogram-e2e"
keywords      = ["telegram", "mtproto", "secret-chat", "e2e", "encryption"]
categories    = ["api-bindings", "cryptography", "asynchronous"]

[dependencies]
ferogram-crypto   = { workspace = true }
ferogram-tl-types = { workspace = true, features = ["tl-api"] }
num-bigint = "0.5.1"
num-traits = "0.2"
thiserror  = "2"
tokio      = { version = "1.23.1", features = ["sync", "time", "rt", "macros"] }
tracing    = { workspace = true }
rand       = "0.10.0"
sha1       = "0.11.0"
sha2       = "0.11.0"
md5        = "0.8.0"

[dev-dependencies]
tempfile = "3"
