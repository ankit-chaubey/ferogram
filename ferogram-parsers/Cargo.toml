[package]
name        = "ferogram-parsers"
description = "Telegram HTML and Markdown entity parsers for ferogram"
readme      = "README.md"
version.workspace    = true
edition.workspace    = true
license.workspace    = true
authors.workspace    = true
repository.workspace = true
homepage.workspace   = true
documentation = "https://docs.rs/ferogram-parsers"
keywords      = ["telegram", "markdown", "html", "entities", "formatting"]
categories    = ["api-bindings", "text-processing"]

[dependencies]
ferogram-tl-types = { workspace = true, features = ["tl-api"] }
html5ever        = { version = "0.39.0", optional = true }

[features]
default   = ["html"]
## HTML message parsing/rendering (`<b>`, `<i>`, `<a href>`, etc. to/from entities).
html      = []
## Use html5ever for stricter, more spec-compliant HTML parsing instead of
## the built-in lightweight parser.
html5ever = ["dep:html5ever"]

[package.metadata.docs.rs]
features     = ["html", "html5ever"]
rustdoc-args = ["--cfg", "docsrs"]
